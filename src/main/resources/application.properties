spring.application.name=mentalhealth.app

# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mental_health_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Twilio SMS API Configuration (Dummy / Env-backed)
twilio.account.sid=${TWILIO_ACCOUNT_SID:AC_DUMMY_ACCOUNT_SID_HERE}
twilio.auth.token=${TWILIO_AUTH_TOKEN:DUMMY_AUTH_TOKEN_HERE}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+10000000000}

# Groq AI / Spring AI Configuration (Dummy / Env-backed)
spring.ai.openai.api-key=${GROQ_API_KEY:gsk_DUMMY_GROQ_API_KEY_STRING_FOR_TESTING_PURPOSES}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.7
spring.ai.retry.max-attempts=1

# Spring Mail (SMTP) Configuration (Dummy)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Free Phone Call API Configuration
inout.api.key=${INOUT_API_KEY:DUMMY_API_KEY_HERE}