<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PHQ-9 Depression Assessment</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 700px; background: #fff; margin: auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .question { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .question p { font-weight: 600; color: #34495e; }
        label { display: block; margin: 5px 0; cursor: pointer; color: #555; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; width: 100%; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #2980b9; }
        #resultBox { margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 5px solid #2ecc71; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Patient Health Questionnaire (PHQ-9)</h2>
    <p style="text-align: center; color: #7f8c8d;">Over the last 2 weeks, how often have you been bothered by any of the following problems?</p>
    
    <form id="phq9Form">
        <div id="questionsContainer"></div>
        <button type="button" onclick="submitPhq9()">Submit Assessment</button>
    </form>

    <div id="resultBox">
        <h3>Assessment Result</h3>
        <p id="resultText"></p>
    </div>
</div>

<script>
    const questions = [
        "Little interest or pleasure in doing things",
        "Feeling down, depressed, or hopeless",
        "Trouble falling or staying asleep, or sleeping too much",
        "Feeling tired or having little energy",
        "Poor appetite or overeating",
        "Feeling bad about yourself — or that you are a failure or have let yourself or your family down",
        "Trouble concentrating on things, such as reading the newspaper or watching television",
        "Moving or speaking so slowly that other people could have noticed? Or the opposite — being so fidgety or restless that you have been moving around a lot more than usual",
        "Thoughts that you would be better off dead or of hurting yourself in some way"
    ];

    const options = [
        { text: "Not at all", val: 0 },
        { text: "Several days", val: 1 },
        { text: "More than half the days", val: 2 },
        { text: "Nearly every day", val: 3 }
    ];

    const container = document.getElementById("questionsContainer");

    questions.forEach((q, index) => {
        let qDiv = document.createElement("div");
        qDiv.className = "question";
        qDiv.innerHTML = `<p>${index + 1}. ${q}</p>`;
        
        options.forEach(opt => {
            qDiv.innerHTML += `
                <label>
                    <input type="radio" name="q${index}" value="${opt.val}" required> ${opt.text} (${opt.val})
                </label>`;
        });
        container.appendChild(qDiv);
    });

    function submitPhq9() {
        let answers = [];
        for (let i = 0; i < questions.length; i++) {
            let selected = document.querySelector(`input[name="q${i}"]:checked`);
            if (!selected) {
                alert(`Please answer question ${i + 1}`);
                return;
            }
            answers.push(parseInt(selected.value));
        }

        const payload = {
            studentId: 53, // Replace with dynamic logged-in student session ID
            answers: answers
        };

        fetch('/api/phq9/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            const resultBox = document.getElementById("resultBox");
            const resultText = document.getElementById("resultText");
            resultBox.style.display = "block";
            resultText.innerHTML = `<strong>Total Score:</strong> ${data.totalScore} <br><strong>Severity Level:</strong> ${data.level}`;
        })
        .catch(err => {
            console.error('Error submitting test:', err);
            alert('Failed to submit test.');
        });
    }
</script>

</body>
</html>
